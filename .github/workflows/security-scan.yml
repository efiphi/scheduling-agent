name: Security scan

# OWASP ZAP against the api and the built web app (ADR-020). Passive only: it reads what comes
# back and attacks nothing, so it is safe and fast. Separate from CI because it needs a running
# system and a large image. Runs when the api or the web app changes, and once a week, since
# ZAP's own rules are updated.
on:
  pull_request:
  schedule:
    - cron: "47 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by digest, like every other image (T20).
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238

jobs:
  zap:
    name: OWASP ZAP (passive, api and web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its base, to see what this change touches

      - name: Does this change touch what is scanned?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          pattern='^(services/api/|packages/shared/|web/|deploy/zap/|\.github/workflows/security-scan\.yml)'
          if [ "$EVENT" != pull_request ] || git diff --name-only HEAD^1 HEAD | grep -Eq "$pattern"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing here changes what is scanned." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Passwords for this run only; nothing here is a real secret.
      - name: Generate throwaway passwords
        if: steps.changes.outputs.relevant == 'true'
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD OWNER_DB_PASSWORD API_DB_PASSWORD GATEWAY_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start the api
        if: steps.changes.outputs.relevant == 'true'
        env:
          GOOGLE_LOGIN_CLIENT_ID: ci-placeholder
          GOOGLE_LOGIN_CLIENT_SECRET: ci-placeholder
        run: docker compose -f deploy/compose/compose.yaml up -d --build --wait api

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 24

      - name: Build and serve the web app
        if: steps.changes.outputs.relevant == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          nohup npx vite preview --port 4173 --host 127.0.0.1 > /dev/null 2>&1 &
          timeout 30 sh -c 'until curl -sf http://127.0.0.1:4173/ > /dev/null; do sleep 1; done'

      - name: Prepare the scan folder
        if: steps.changes.outputs.relevant == 'true'
        run: |
          mkdir zap-work
          cp deploy/zap/*.tsv web/src/api/openapi.json zap-work/
          chmod -R a+rwX zap-work

      # The api redirects logins to Google. Pointing that name at nothing keeps the scan on our
      # own system, so a scanner never touches someone else's.
      - name: Scan the api
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker run --rm --network host --add-host accounts.google.com:127.0.0.1 \
            -v "$PWD/zap-work:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t openapi.json -f openapi -O http://127.0.0.1:8000 -S \
            -c api-rules.tsv -J api-report.json

      # Even when the api scan failed: a run should show everything it found at once.
      - name: Scan the web app
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        run: |
          docker run --rm --network host -v "$PWD/zap-work:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:4173/ -m 1 -c web-rules.tsv -J web-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        with:
          name: zap-reports
          path: |
            zap-work/api-report.json
            zap-work/web-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop the api
        if: ${{ always() && steps.changes.outputs.relevant == 'true' }}
        run: docker compose -f deploy/compose/compose.yaml down --volumes
