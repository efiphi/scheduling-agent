name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      # Third-party actions are pinned to commit SHAs, not tags (T20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so a secret in any past commit is caught (T17)
          persist-credentials: false

      # Same gitleaks version as the pre-commit hook, verified against a pinned checksum.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks

      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  python:
    name: Python (lint, types, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # --locked fails if uv.lock does not match pyproject.toml: no surprise upgrades (T20).
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Tests that need a real Postgres or Redis run in the database job.
      - run: uv run pytest -m "not db and not redis"
      # Our own workspace packages are editable and not on PyPI, so they are skipped;
      # any known vulnerability in a third-party dependency still fails the job.
      - run: uv run pip-audit --skip-editable

  docker:
    name: Docker (build images, smoke-test the gateway, validate Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build api image
        run: docker build -f services/api/Dockerfile -t scheduling-agent-api:ci .

      - name: Build google-gateway image
        run: docker build -f services/google_gateway/Dockerfile -t scheduling-agent-gateway:ci .

      - name: Build agent image
        run: docker build -f services/agent/Dockerfile -t scheduling-agent-agent:ci .

      - name: Build migrations image
        run: docker build -f packages/db/Dockerfile -t scheduling-agent-migrations:ci .

      - name: Images run as a non-root user
        run: |
          for image in scheduling-agent-api:ci scheduling-agent-gateway:ci scheduling-agent-agent:ci scheduling-agent-migrations:ci; do
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "10001:10001"
          done

      # Invariant 1 at the image level: the api cannot call Google even if compromised,
      # because the code to do so is not there.
      - name: The api image has no Google client libraries
        run: |
          docker run --rm --entrypoint python scheduling-agent-api:ci -c \
            "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('google_gateway', 'googleapiclient', 'google_auth_oauthlib')))"

      # ADR-011 at the image level: the agent, which reads untrusted email, has no code to
      # reach the database or Google with.
      - name: The agent image has no database or Google libraries
        run: |
          docker run --rm --entrypoint python scheduling-agent-agent:ci -c \
            "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('db', 'sqlalchemy', 'psycopg', 'google_gateway', 'googleapiclient')))"

      # The gateway starts and answers /healthz with throwaway values. It touches neither
      # the database nor Redis until a request needs them.
      - name: Smoke-test the google-gateway container
        run: |
          key=$(docker run --rm scheduling-agent-gateway:ci python -m google_gateway.keys)
          echo "::add-mask::$key"
          docker run -d --name gateway --read-only --cap-drop ALL -p 127.0.0.1:8001:8001 \
            -e GOOGLE_CONNECT_CLIENT_ID=ci-placeholder -e GOOGLE_CONNECT_CLIENT_SECRET=ci-placeholder \
            -e GATEWAY_DB_PASSWORD=ci-placeholder -e REDIS_PASSWORD=ci-placeholder \
            -e TOKEN_ENCRYPTION_KEYS="$key" scheduling-agent-gateway:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8001/healthz && exit 0
            sleep 1
          done
          docker logs gateway
          exit 1

      # Placeholder values only; real secrets live in a git-ignored .env (T17).
      - name: Validate Compose file
        env:
          POSTGRES_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          OWNER_DB_PASSWORD: ci-placeholder
          API_DB_PASSWORD: ci-placeholder
          GATEWAY_DB_PASSWORD: ci-placeholder
          GOOGLE_LOGIN_CLIENT_ID: ci-placeholder
          GOOGLE_CONNECT_CLIENT_ID: ci-placeholder
          GOOGLE_CONNECT_CLIENT_SECRET: ci-placeholder
          TOKEN_ENCRYPTION_KEYS: ci-placeholder
        run: docker compose -f deploy/compose/compose.yaml config --quiet

      # Known vulnerabilities in what we ship: OS packages and Python libraries in each image.
      # Fails on HIGH or CRITICAL ones that have a fixed version available (T20).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" trivy

      - name: Scan images for vulnerabilities (Trivy)
        run: |
          for image in api gateway agent migrations; do
            ./trivy image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --scanners vuln "scheduling-agent-${image}:ci"
          done

  kubernetes:
    name: Kubernetes (helm lint, schemas, chart tests, Trivy config)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v4.3.0
      HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      # Schemas for the custom resources (SealedSecret, Argo CD), pinned to a commit.
      CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/3eb90d47aba8d61919d4419dd38301536e32a94b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every tool from its official release, checked against a pinned SHA-256 (T20).
      - name: Install Helm, kubeconform and Trivy
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" --strip-components=1 linux-amd64/helm
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: helm lint (default values and the k3d environment)
        run: |
          helm lint --strict deploy/helm/scheduling-agent
          helm lint --strict deploy/helm/scheduling-agent -f deploy/cluster/environments/k3d/values.yaml

      # Every manifest against the Kubernetes API schemas of the version k3d runs, so a typo
      # in a field name fails here instead of being silently dropped by the cluster.
      - name: Validate manifests against Kubernetes schemas (kubeconform)
        run: |
          helm template scheduling-agent deploy/helm/scheduling-agent \
            -f deploy/cluster/environments/k3d/values.yaml > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location "${CRDS_CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            rendered.yaml deploy/cluster/argocd deploy/cluster/secrets deploy/cluster/sealed-secrets/controller.yaml

      # Misconfigurations in our own manifests (privileged pods, missing limits, ...). The
      # upstream Sealed Secrets and Argo CD manifests are not ours to change, so not scanned.
      - name: Scan manifests for misconfigurations (Trivy)
        run: |
          trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL deploy/helm/scheduling-agent
          trivy config --quiet --exit-code 1 --severity HIGH,CRITICAL deploy/cluster/argocd

      # tests/test_helm.py skips without helm; here helm is installed, so every chart
      # test runs (hardening, per-component secrets, NetworkPolicies, CronJobs).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Chart tests
        run: uv run pytest tests/test_helm.py -v

  database:
    name: Database and Redis, roles, migrations and permissions (T3, T10, T13, T16, T24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fresh random passwords for this run only; nothing secret is stored in CI.
      - name: Generate throwaway passwords
        run: |
          for name in POSTGRES_PASSWORD REDIS_PASSWORD OWNER_DB_PASSWORD API_DB_PASSWORD GATEWAY_DB_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start Postgres (runs init/01-roles.sh on an empty volume) and Redis
        run: docker compose -f deploy/compose/compose.yaml up -d --wait postgres redis

      - name: Attack the roles
        run: docker compose -f deploy/compose/compose.yaml exec -T postgres sh /tests/test-roles.sh

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - run: uv sync --locked

      - name: Run migrations as scheduling_owner
        working-directory: packages/db
        run: |
          export MIGRATION_DATABASE_URL="postgresql+psycopg://scheduling_owner:${OWNER_DB_PASSWORD}@127.0.0.1:5432/scheduling_agent"
          uv run alembic upgrade head
          # Fails if the models and the migrations disagree.
          uv run alembic check

      - name: Attack the tables, test the Redis coordination (T3, T10, T13, T16, T24)
        env:
          REQUIRE_DB: "1"
        run: uv run pytest -m "db or redis" -v

      - name: Stop Postgres and Redis
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes

  web:
    name: Web (API types, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly what package-lock.json says, nothing newer.
      - run: npm ci
      - run: npm audit --audit-level=high
      # The API types are generated from the api's OpenAPI schema (the Python job checks
      # that schema is current). Regenerate and fail if the committed types differ.
      - name: API types match the API
        run: |
          npm run api-types
          git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
