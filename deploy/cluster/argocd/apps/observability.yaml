# The monitoring tools (Layer 3), each an Argo CD Application: the chart from its
# upstream Helm repository at a pinned version, the values from this repository ($values).
# Project "observability": the observability namespace only, and only cluster-scoped
# objects these charts need (their read-only RBAC for the Kubernetes API).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  description: Metrics, logs, traces and dashboards
  sourceRepos:
    - https://github.com/efiphi/scheduling-agent.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
  destinations:
    - {server: https://kubernetes.default.svc, namespace: observability}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  annotations:
    # The namespace, its NetworkPolicies and Grafana's sealed login before the tools.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: observability
  source:
    repoURL: https://github.com/efiphi/scheduling-agent.git
    targetRevision: main
    path: deploy/cluster/observability/manifests
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.37.0
      helm:
        releaseName: prometheus
        valueFiles: [$values/deploy/cluster/observability/prometheus.yaml]
    - repoURL: https://github.com/efiphi/scheduling-agent.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valueFiles: [$values/deploy/cluster/observability/loki.yaml]
    - repoURL: https://github.com/efiphi/scheduling-agent.git
      targetRevision: main
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: tempo
      targetRevision: 3.2.0
      helm:
        releaseName: tempo
        valueFiles: [$values/deploy/cluster/observability/tempo.yaml]
