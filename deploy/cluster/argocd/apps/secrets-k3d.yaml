apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-k3d
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: scheduling-agent
  source:
    repoURL: https://github.com/efiphi/scheduling-agent.git
    targetRevision: main
    path: deploy/cluster/secrets/k3d
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling-agent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
