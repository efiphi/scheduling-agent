# Runs before every commit. Install once per clone: `pre-commit install`.
# Revisions are pinned to commit SHAs (T20); update with `pre-commit autoupdate --freeze`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      # T17: block secrets before they reach the public repo.
      # Uses the gitleaks binary on PATH (same version as CI), so no Go toolchain is needed.
      - id: gitleaks-system
        # gitleaks scans the staged diff itself; it does not take file names.
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        # Helm templates are YAML only after rendering; helm lint and tests/test_helm.py check them.
        exclude: ^deploy/helm/.*/templates/
        # Kubernetes manifests often hold several objects, separated by ---.
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Ruff runs through uv, so its version comes from uv.lock — the same one CI uses.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
