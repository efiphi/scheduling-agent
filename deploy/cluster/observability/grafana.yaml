# Grafana (chart grafana-community/grafana). No state of its own worth keeping: data sources
# (and the dashboards and alerts of step 3.6) are provisioned from this repository, so a
# restart loses nothing. Reached only through `kubectl port-forward`, never an Ingress.
admin:
  existingSecret: grafana-admin  # sealed in manifests/grafana-admin.yaml
testFramework: {enabled: false}
persistence: {enabled: false}
initChownData: {enabled: false}
grafana.ini:
  analytics: {reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false}
  news: {news_feed_enabled: false}
  auth.anonymous: {enabled: false}
  users: {allow_sign_up: false}
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 384Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - {name: Prometheus, type: prometheus, uid: prometheus, url: "http://prometheus-server", isDefault: true}
      - name: Loki
        type: loki
        uid: loki
        url: "http://loki:3100"
        jsonData:
          # A trace id in a log line links to the trace (step 3.2).
          derivedFields:
            - {name: trace_id, matcherRegex: '"trace_id":\s*"(\w+)"', url: "$${__value.raw}", datasourceUid: tempo}
      - name: Tempo
        type: tempo
        uid: tempo
        url: "http://tempo:3200"
        jsonData:
          tracesToLogsV2: {datasourceUid: loki, filterByTraceID: true}

# Dashboards from git (dashboards/*.json, packed by render_dashboards.py into the
# grafana-dashboards ConfigMap). Read-only in the UI: a change goes through a pull request.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: scheduling-agent
      folder: Scheduling agent
      type: file
      disableDeletion: true
      editable: false
      options:
        path: /var/lib/grafana/dashboards/scheduling-agent
dashboardsConfigMaps:
  scheduling-agent: grafana-dashboards

# Alert rules as code (step 3.6). They show in Grafana's alert list; no contact point sends
# them anywhere yet (no email or chat service is configured). Security detections come in
# Layer 5; these are about the system working. noDataState: a missing poll metric alerts,
# since silence there is itself the failure (E13).
alerting:
  rules.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: scheduling-agent
      folder: Scheduling agent
      interval: 1m
      rules:
      - uid: sa-poll-stale
        title: Email is not being read (E13)
        condition: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: 'No successful gmail-poll run for over 10 minutes: new email is not reaching the agent.'
        data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: time() - kube_cronjob_status_last_successful_time{namespace="scheduling-agent", cronjob="gmail-poll"}
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 600
      - uid: sa-restarts
        title: A service keeps restarting
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: A pod restarted more than twice in 15 minutes (the agent once restarted 91 times unnoticed).
        data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="scheduling-agent"}[15m]))
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 2
      - uid: sa-backlog
        title: A queue is not draining (E13)
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'More than 20 messages waiting on a stream for 10 minutes: its consumer is stuck or down.'
        data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: max by (stream) (sa_queue_backlog)
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 20
      - uid: sa-llm-budget
        title: Model spend near the daily cap (T24)
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Over 80% of today's model budget is spent; at 100% the agent pauses until tomorrow.
        data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: max(sa_llm_spent_today_usd) / max(sa_llm_daily_budget_usd)
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 0.8
      - uid: sa-execution-failed
        title: An approved action failed
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: An action you approved was not carried out; the agent asked you about it in the app.
        data:
        - refId: A
          datasourceUid: prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: sum by (outcome) (increase(sa_actions_executed_total{outcome=~"failed_.*"}[1h]))
            instant: true
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 0
      - uid: sa-error-logs
        title: Errors in the logs
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: More than 5 error lines in 10 minutes from one service.
        data:
        - refId: A
          datasourceUid: loki
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: sum by (app) (count_over_time({namespace="scheduling-agent", level="error"}[10m]))
            instant: true
            queryType: instant
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: threshold
            expression: A
            conditions:
            - evaluator:
                type: gt
                params:
                - 5
