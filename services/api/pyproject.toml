[project]
name = "api"
version = "0.0.0"
description = "Entry point: web app API, WhatsApp webhooks, Google login (identity only), approvals."
requires-python = ">=3.12"
# Only what this service needs. In particular: no Google client libraries here —
# api never holds Google tokens (invariant 1, ADR-006, ADR-010).
dependencies = ["fastapi", "shared", "uvicorn"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
