# Local development stack. From the repository root:
#   cp deploy/compose/.env.example deploy/compose/.env   # then put real random values in .env
#   docker compose -f deploy/compose/compose.yaml up -d --wait
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from the network.
# Images are pinned by digest (T20). Secrets come from .env, which git ignores (T17).

name: scheduling-agent

x-hardening: &hardening
  # Drop every Linux capability and forbid gaining new privileges (T21).
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    <<: *hardening
    # The official image starts as root and switches to the postgres user itself;
    # it needs these capabilities to do that and to own its data directory.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: scheduling_agent
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduling_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    <<: *hardening
    cap_add: [SETGID, SETUID]
    # Password required for every client. Append-only file so queued work survives
    # a restart (ADR-004). Per-service Redis users (ACL) come with the services in Layer 1.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/compose/.env}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: scheduling-agent-api:dev
    <<: *hardening
    # Runs as the unprivileged user from the Dockerfile, on a read-only filesystem.
    read_only: true
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
