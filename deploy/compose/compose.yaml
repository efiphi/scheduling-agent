# Local development stack. From the repository root:
#   cp deploy/compose/.env.example deploy/compose/.env   # then put real random values in .env
#   docker compose -f deploy/compose/compose.yaml up -d --wait
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from the network.
# Images are pinned by digest (T20). Secrets come from .env, which git ignores (T17).

name: scheduling-agent

x-hardening: &hardening
  # Drop every Linux capability and forbid gaining new privileges (T21).
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# What both google-gateway processes need: their own database role, Redis, the Google
# client and the token encryption key. Nothing else from .env (no owner or api password).
x-gateway-runtime: &gateway-runtime
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in deploy/compose/.env}
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/compose/.env}
    GOOGLE_CONNECT_CLIENT_ID: ${GOOGLE_CONNECT_CLIENT_ID:?set GOOGLE_CONNECT_CLIENT_ID in deploy/compose/.env}
    GOOGLE_CONNECT_CLIENT_SECRET: ${GOOGLE_CONNECT_CLIENT_SECRET:?set GOOGLE_CONNECT_CLIENT_SECRET in deploy/compose/.env}
    TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS:?set TOKEN_ENCRYPTION_KEYS in deploy/compose/.env}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    <<: *hardening
    # The official image starts as root and switches to the postgres user itself;
    # it needs these capabilities to do that and to own its data directory.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: scheduling_agent
      # Every TCP connection needs a password, including from inside the container
      # (the image otherwise trusts 127.0.0.1). Only the in-container Unix socket stays
      # passwordless, for init scripts and health checks. Found by tests/test-roles.sh.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      # One role per service, created by postgres/init/01-roles.sh (invariant 7).
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in deploy/compose/.env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in deploy/compose/.env}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in deploy/compose/.env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      # Init scripts run only when the data volume is empty.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduling_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    <<: *hardening
    cap_add: [SETGID, SETUID]
    # Password required for every client. Append-only file so queued work survives
    # a restart (ADR-004). Per-service Redis users (ACL) come with the services in Layer 1.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/compose/.env}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: scheduling-agent-api:dev
    <<: *hardening
    # Runs as the unprivileged user from the Dockerfile, on a read-only filesystem.
    read_only: true
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # google-gateway: one image, two processes. Only these two containers get Google
  # secrets and the token key; the api container gets none of them (invariant 1).
  google-gateway:
    build:
      context: ../..
      dockerfile: services/google_gateway/Dockerfile
    image: scheduling-agent-gateway:dev
    <<: [*hardening, *gateway-runtime]
    # The OAuth callback (ADR-010). Port and path match the gateway-connect client.
    ports: ["127.0.0.1:8001:8001"]

  gmail-poller:
    image: scheduling-agent-gateway:dev
    <<: [*hardening, *gateway-runtime]
    # Every minute, every connected mailbox (ADR-003). A CronJob in Layer 2.
    command: ["python", "-m", "google_gateway.poll", "--every", "60"]
    # No HTTP server, so no health check; restart if the process dies.
    healthcheck: { disable: true }
    depends_on:
      google-gateway: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
