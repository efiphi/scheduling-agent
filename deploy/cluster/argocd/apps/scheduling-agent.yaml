apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduling-agent
  namespace: argocd
spec:
  project: scheduling-agent
  # The environment branch (ADR-021): main, as tested, plus the image digests the CI bot
  # writes after each green build. The bot can write to deploy/k3d only; main is protected.
  source:
    repoURL: https://github.com/efiphi/scheduling-agent.git
    targetRevision: deploy/k3d
    path: deploy/helm/scheduling-agent
    helm:
      releaseName: scheduling-agent
      valueFiles:
        - ../../cluster/environments/k3d/values.yaml     # the image digests (CI)
        - ../../cluster/environments/k3d/settings.yaml   # k3d's own settings
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling-agent
  syncPolicy:
    # selfHeal: a change made by hand in the cluster (kubectl edit) is reverted to git.
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
