{{- /*
Redis with a password and an append-only file, so queued work survives a restart
(ADR-004). It runs as the image's redis user (uid 999).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  labels:
    {{- include "sa.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "sa.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        {{- include "sa.labels" . | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      # No automatic SERVICE_HOST/SERVICE_PORT variables for every Service: they collide
      # with our own (REDIS_PORT=tcp://...) and tell a pod about services it never uses.
      enableServiceLinks: false
      securityContext:
        {{- include "sa.podSecurity" . | nindent 8 }}
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.images.redis | quote }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          # $(REDIS_PASSWORD) is expanded by Kubernetes from the Secret below.
          args: [redis-server, --requirepass, $(REDIS_PASSWORD), --appendonly, "yes"]
          securityContext:
            {{- include "sa.containerSecurity" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: redis
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec:
              command: [sh, -c, 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "sa.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
