# Security headers on every response (T19). Included in each location, because nginx drops
# inherited add_header lines in any block that adds its own. The script and data rules
# (Content-Security-Policy) are a <meta> tag in index.html (vite.config.ts); a meta tag cannot
# forbid framing, so that part is a header here.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
