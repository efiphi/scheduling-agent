# Grafana Alloy (chart grafana/alloy): the one collector.
#  - Pod logs of the scheduling-agent namespace, read through the Kubernetes API rather
#    than from the node's disk, so Alloy runs without root or host mounts.
#  - OTLP from the services (steps 3.3–3.5): traces to Tempo, metrics to Prometheus,
#    logs to Loki.
# Its optional CRDs (PodLogs, for the Prometheus operator) are not used here, and the
# observability project does not allow CRDs: they are cluster-wide.
crds: {create: false}
controller:
  type: deployment
  replicas: 1
  # Alloy's working state (/tmp/alloy) on an emptyDir: the root filesystem is read-only.
  volumes:
    extra: [{name: storage, emptyDir: {sizeLimit: 256Mi}}]
alloy:
  mounts:
    varlog: false
    dockercontainers: false
    extra: [{name: storage, mountPath: /tmp/alloy}]
  extraPorts:
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces { names = ["scheduling-agent"] }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }

      // Our services log one JSON object per line (shared.log). The level becomes a label,
      // so errors can be selected without parsing; everything else stays a field, read
      // with `| json` in a query (labels must stay few, or Loki slows down).
      loki.process "json" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint { url = "http://loki:3100/loki/api/v1/push" }
      }

      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          logs    = [otelcol.exporter.loki.default.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo:4317"
          tls { insecure = true }
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.default.receiver]
      }

      prometheus.remote_write "default" {
        endpoint { url = "http://prometheus-server/api/v1/write" }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }
