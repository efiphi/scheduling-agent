# nginx for the built web app: static files and nothing else (no proxying; Traefik routes
# /api to the api service). Everything nginx writes goes to /tmp, an emptyDir, so the
# container's root filesystem stays read-only (T21).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off; # Traefik is the edge; it already sees every request
  server_tokens off; # no version in headers or error pages
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    # No uploads: the web app only sends small JSON to /api, which nginx never serves.
    client_max_body_size 1k;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Vite's hashed files never change under the same name: cache them for a year.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Everything else is the single-page app: its own router reads the path.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
