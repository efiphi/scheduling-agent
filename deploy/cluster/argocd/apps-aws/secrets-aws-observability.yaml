# The monitoring namespace's sealed Secrets (Grafana's login, the alert relay's token).
# Sealed with this cluster's key, so they live with the cluster's other secrets and not in
# the shared observability manifests, which the cloud cluster uses too.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-aws-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: observability
  source:
    repoURL: https://github.com/efiphi/scheduling-agent.git
    targetRevision: main
    path: deploy/cluster/secrets/aws/observability
  destination: {server: https://kubernetes.default.svc, namespace: observability}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
