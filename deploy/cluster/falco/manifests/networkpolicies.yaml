# The falco namespace takes no traffic but Prometheus reading the metrics port. Falco itself
# talks to nothing over the network: the kernel probe and containerd's socket are local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: falco}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: metrics-from-prometheus, namespace: falco}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: falco}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server}}
      ports:
        - {protocol: TCP, port: 8765}
