# The cloud server's values (ADR-023), applied after environments/k3d/values.yaml, which
# carries the image digests. Only what differs from k3d is here; secrets are sealed in
# deploy/cluster/secrets/aws with this cluster's own key.

# One 4 GiB server runs everything (ADR-023). Every Python process uses about 80Mi but
# reserves 192-256Mi, which adds up to more than the server has; reserve 128Mi each instead.
memoryRequest: 128Mi
# One core in all, and k3d's reservations (50-100m each) fill it before every pod is placed.
# The processes use a few millicores each when idle (measured 18.11: 86m for the whole node).
cpuRequest: 10m
# And never two copies at once: a new image rolled out to every process together would
# otherwise double their memory for a while (seen on the first deploy). A process is down
# for the few seconds its replacement takes to start.
rollingUpdate: {maxSurge: 0, maxUnavailable: 1}

# The public address: one host, HTTPS only, the web app at / and the api under /api.
publicHost: agent.efi-agent.dev
web:
  enabled: true

# Public addresses. Not secret, so here rather than in the sealed Secrets; a value set here
# wins over the same key in a Secret (env before envFrom).
workloads:
  api:
    env:
      WEB_APP_URL: https://agent.efi-agent.dev/
      # Under /api, like everything the api serves on this host.
      GOOGLE_LOGIN_REDIRECT_URI: https://agent.efi-agent.dev/api/auth/google/callback
  notifier:
    env:
      WEB_APP_URL: https://agent.efi-agent.dev/
  google-gateway:
    env:
      GOOGLE_CONNECT_REDIRECT_URI: https://agent.efi-agent.dev/oauth/google/callback

# Since step 6.5 this cluster reads the demo mailbox and sends the owner's alerts; k3d does
# neither (environments/k3d/settings.yaml).
