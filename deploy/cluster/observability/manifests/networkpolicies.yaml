# Who may talk to the monitoring tools (T21). Ingress is denied by default; each tool
# accepts only the components that write to or read from it:
#
#   scheduling-agent pods -> alloy:4317/4318   OTLP (steps 3.3–3.5)
#   alloy                 -> loki, tempo, prometheus   writes
#   grafana               -> loki, tempo, prometheus   reads
#   prometheus            -> kube-state-metrics
#
# Grafana accepts no traffic from any pod: it is reached only with kubectl port-forward.
# Egress is not restricted here yet: Prometheus and Alloy talk to the Kubernetes API,
# whose address is the node's. Narrowing it is a follow-up, like the agent's egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: observability}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alloy, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: scheduling-agent}}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: loki, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 3100}]
    # Its own cluster traffic (memberlist, gRPC), even with one replica.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: loki}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: tempo, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
      ports: [{protocol: TCP, port: 4317}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 3200}]
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alloy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 9090}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kube-state-metrics, namespace: observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: kube-state-metrics}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server}}
      ports: [{protocol: TCP, port: 8080}]
